stages:
  - test
  - build

variables:
  # Полное имя образа для сохранения в вашем реестре
  IMAGE_NAME: "10.57.198.153:5050/$CI_PROJECT_PATH/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# Стейдж тестирования (Работает стабильно)
run_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen
    - PYTHONPATH=predict_service uv run pytest predict_service/tests/

# Стейдж сборки и отправки в GitLab Container Registry
build_and_push:
  stage: build
  image: docker:24.0.7-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    # Указываем докеру искать конфиг в специальной папке
    DOCKER_CONFIG: /root/.docker
  before_script:
    # Создаем конфигурационный файл для демона хоста через переменные клиента
    - mkdir -p /root/.docker
    - echo '{"insecure-registries":["10.57.198.153:5050"]}' > /root/.docker/config.json
    # Логинимся по IP-адресу
    - echo "$CI_REGISTRY_PASSWORD" | docker login 10.57.198.153:5050 -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t 10.57.198.153:5050/$CI_PROJECT_PATH/predict_service:$IMAGE_TAG -t 10.57.198.153:5050/$CI_PROJECT_PATH/predict_service:latest -f predict_service/Dockerfile predict_service/
    - docker push 10.57.198.153:5050/$CI_PROJECT_PATH/predict_service:$IMAGE_TAG
    - docker push 10.57.198.153:5050/$CI_PROJECT_PATH/predict_service:latest
  only:
    - main
    - dev
