stages:
  - test
  - build

variables:
  IMAGE_NAME: "10.57.198.153:5050/$CI_PROJECT_PATH/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  # Увеличиваем таймаут сети для скачивания больших ML-библиотек (в секундах)
  UV_HTTP_TIMEOUT: "300"

# Стейдж тестирования
run_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen
    - PYTHONPATH=predict_service uv run pytest predict_service/tests/

# Стейдж сборки и отправки в GitLab Container Registry
build_and_push:
  stage: build
  image: docker:24.0.7-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login 10.57.198.153:5050 -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest -f predict_service/Dockerfile predict_service/
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - main
    - dev
