stages:
  - test
  - build

variables:
  IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# Стейдж тестирования (Используем готовый официальный образ с glibc)
run_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen # Синхронизируем зависимости из вашего uv.lock
    # Явно передаем PYTHONPATH, чтобы python видел папку predict_service как корневую для импортов приложения
    - PYTHONPATH=predict_service uv run pytest predict_service/tests/

# Стейдж сборки и отправки в GitLab Container Registry
build_and_push:
  stage: build
  image: docker:24.0.7-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    # 1. Создаем папку конфигурации докера для текущего пользователя джобы
    - mkdir -p ~/.docker
    # 2. Записываем правило доверия к локальному HTTP-реестру напрямую в конфиг клиента
    - echo "{\"insecure-registries\":[\"$CI_REGISTRY\"]}" > ~/.docker/config.json
    # 3. Авторизуемся (теперь клиент знает, что этот эндпоинт работает без SSL)
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest -f predict_service/Dockerfile predict_service/
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - main
    - dev
