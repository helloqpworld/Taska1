stages:
  - test
  - build

variables:
  # Полное имя образа для сохранения в вашем реестре
  IMAGE_NAME: "10.57.198.153:5050/$CI_PROJECT_PATH/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# Стейдж тестирования (Работает стабильно)
run_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen
    - PYTHONPATH=predict_service uv run pytest predict_service/tests/

# Стейдж сборки (Возвращаемся к надежному сокету хоста)
build_and_push:
  stage: build
  image: docker:24.0.7-cli
  variables:
    # Общаемся напрямую с докером вашей Xubuntu
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    # Логинимся напрямую по IP и порту, чтобы избежать TLS-проверок на стороне клиента
    - echo "$CI_REGISTRY_PASSWORD" | docker login gitlab:5050 -u $CI_REGISTRY_USER --password-stdin
  script:
    # Собираем образ, тегируя его через внутреннее имя хоста реестра
    - docker build -t gitlab:5050/$CI_PROJECT_PATH/predict_service:$IMAGE_TAG -t gitlab:5050/$CI_PROJECT_PATH/predict_service:latest -f predict_service/Dockerfile predict_service/
    # Пушим во внутреннюю сеть
    - docker push gitlab:5050/$CI_PROJECT_PATH/predict_service:$IMAGE_TAG
    - docker push gitlab:5050/$CI_PROJECT_PATH/predict_service:latest
  only:
    - main
    - dev
