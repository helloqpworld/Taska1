stages:
  - test
  - build

variables:
  IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# Стейдж тестирования
run_tests:
  stage: test
  image: python:3.11-slim
  before_script:
    # Устанавливаем официальный менеджер uv внутри чистой стандартной системы
    - apt-get update && apt-get install -y curl
    - curl -LsSf https://astral.sh | sh
    - export PATH="/root/.local/bin:$PATH"
  script:
    - uv sync --frozen
    - uv run pytest predict_service/tests/

# Стейдж сборки и отправки в GitLab Container Registry
build_and_push:
  stage: build
  image: docker:24.0.7-cli
  services:
    - docker:24.0.7-dind
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest -f predict_service/Dockerfile predict_service/
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  only:
    - main
    - dev
