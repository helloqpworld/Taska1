stages:
  - test
  - build

variables:
  # 172.17.0.1 — это стандартный IP-адрес твоего сервера Contabo внутри мира Docker.
  # Для докер-клиента джобы этот адрес является приватным локальным шлюзом,
  # поэтому он гарантированно НЕ будет требовать HTTPS и SSL-сертификаты.
  REGISTRY_GATEWAY: "172.17.0.1:5050"
  IMAGE_NAME: "$REGISTRY_GATEWAY/root/taska1/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  UV_HTTP_TIMEOUT: "300"

# Стейдж тестирования (Работает стабильно)
run_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen
    - PYTHONPATH=predict_service uv run pytest predict_service/tests/
  tags:
    - docker

# Стейдж сборки и пуша
build_and_push:
  stage: build
  image: docker:24.0.7-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    # Авторизуемся во внутреннем реестре через IP-шлюз Docker хоста
    - echo "$CI_REGISTRY_PASSWORD" | docker login http://$REGISTRY_GATEWAY -u $CI_REGISTRY_USER --password-stdin
  script:
    # Собираем образ из контекста predict_service
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest -f predict_service/Dockerfile predict_service/
    # Пушим образ прямо в локальный Container Registry сервера
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  tags:
    - docker
  only:
    - main
    - dev
    - feature/server-deployment
