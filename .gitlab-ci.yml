stages:
  - test
  - build
  - deploy_k8s

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  UV_HTTP_TIMEOUT: "300"

# 1. Автоматические тесты
run_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen
    - PYTHONPATH=predict_service uv run pytest predict_service/tests/
  tags:
    - docker

# 2. Автоматическая сборка через Kaniko
build_local:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/predict_service"
      --dockerfile "${CI_PROJECT_DIR}/predict_service/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"
      --destination "$IMAGE_NAME:latest"
      --insecure
  tags:
    - docker

# 3. АВТОМАТИЧЕСКИЙ ДЕПЛОЙ В KUBERNETES (CD)
deploy_to_cluster:
  stage: deploy_k8s
  image: alpine:3.18
  script:
    - apk add --no-cache curl
    - curl -LO https://dl.k8s.io/release/`curl -LS https://dl.k8s.io/release/stable.txt`/bin/linux/amd64/kubectl
    - chmod +x ./kubectl
    - mv ./kubectl /usr/local/bin/kubectl
    - echo "$KUBECONFIG_BASE64" | base64 -d > ./kubeconfig.yaml
    # 2. Подменяем 127.0.0.1 на внешний IP твоего сервера Contabo,
    # чтобы контейнер раннера из любой сети мог достучаться до API Kubernetes!
    - sed -i 's/127.0.0.1/169.58.244.233/g' ./kubeconfig.yaml
    - export KUBECONFIG=./kubeconfig.yaml
    - echo "Авторизация по внешнему IP прошла успешно! Начинаем деплой манифестов..."
    # 3. Накатываем всю нашу архитектуру, явно скармливая файл через флаг --kubeconfig
    # и отключая фоновую загрузку схем openapi через --validate=false
    - kubectl apply -f deploy/rbac.yaml
    - kubectl apply -f deploy/resource-quota.yaml
    - kubectl apply -f deploy/limit-range.yaml
    - kubectl apply -f deploy/deployment.yaml
    - kubectl apply -f deploy/service-ingress.yaml
    # DevOps-практика: дожидаемся, пока поды пройдут инициализацию и запустятся
    - kubectl rollout status deployment/fastapi-predict-deployment -n predict-service-ns --timeout=60s
  tags:
    - docker
  only:
    - main
    - dev
    - feature/server-deployment
