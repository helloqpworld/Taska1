stages:
  - test
  - build

variables:
  # Возвращаем стандартную системную переменную GitLab Container Registry
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  UV_HTTP_TIMEOUT: "300"

# Стейдж тестирования (Работает стабильно)
run_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen
    - PYTHONPATH=predict_service uv run pytest predict_service/tests/
  tags:
    - docker

# Стейдж сборки и пуша через Kaniko (DevOps стандарт)
build_and_push:
  stage: build
  # Используем официальный debug-образ Kaniko (версия debug содержит встроенный shell)
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    # 1. Создаем папку для конфигурации авторизации реестра
    - mkdir -p /kaniko/.docker
    # 2. Генерируем системный токен авторизации для GitLab Container Registry
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    # 3. Запускаем сборку и пуш с флагом --insecure, который намертво отключает HTTPS
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/predict_service"
      --dockerfile "${CI_PROJECT_DIR}/predict_service/Dockerfile"
      --destination "$IMAGE_NAME:$IMAGE_TAG"
      --destination "$IMAGE_NAME:latest"
      --insecure
  tags:
    - docker
  only:
    - main
    - dev
    - feature/server-deployment
