stages:
  - test
  - build

variables:
  # DevOps-практика: подставляем имя контейнера реестра из твоего docker-compose.
  # Так как раннер использует хост-сокет, адрес localhost:5050 для него является
  # родным, безопасным (loopback) интерфейсом, для которого Docker НИКОГДА не требует HTTPS.
  REGISTRY_LOCAL: "localhost:5050"
  IMAGE_NAME: "$REGISTRY_LOCAL/root/taska1/predict_service"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  UV_HTTP_TIMEOUT: "300"

# Стейдж тестирования (Работает стабильно)
run_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  script:
    - uv sync --frozen
    - PYTHONPATH=predict_service uv run pytest predict_service/tests/
  tags:
    - docker

# Стейдж сборки
build_and_push:
  stage: build
  image: docker:24.0.7-cli
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  before_script:
    # Логинимся через безопасный интерфейс localhost хост-системы
    - echo "$CI_REGISTRY_PASSWORD" | docker login $REGISTRY_LOCAL -u $CI_REGISTRY_USER --password-stdin
  script:
    # Собираем образ из контекста predict_service
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest -f predict_service/Dockerfile predict_service/
    # Пушим обе версии в локальный Container Registry
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  tags:
    - docker
  only:
    - main
    - dev
    - feature/server-deployment
