apiVersion: v1
kind: Namespace
metadata:
  name: predict-service-ns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: predict-service-sa
  namespace: predict-service-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: predict-service-role
  namespace: predict-service-ns
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: predict-service-rb
  namespace: predict-service-ns
subjects:
  - kind: ServiceAccount
    name: predict-service-sa
    namespace: predict-service-ns
roleRef:
  kind: Role
  name: predict-service-role
  apiGroup: rbac.authorization.k8s.io
