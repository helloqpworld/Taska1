apiVersion: v1
kind: Service
metadata:
  name: fastapi-predict-service
  namespace: predict-service-ns
spec:
  selector:
    app: fastapi-predict
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-predict-ingress
  namespace: predict-service-ns
spec:
  # НАШЕ ФИНАЛЬНОЕ ИСПРАВЛЕНИЕ: Официальный современный класс Ingress-контроллера!
  ingressClassName: nginx
  rules:
    - host: predict.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-predict-service
                port:
                  number: 8000
