apiVersion: v1
kind: Service
metadata:
  name: fastapi-predict-service
  namespace: predict-service-ns
spec:
  selector:
    app: fastapi-predict # Связываем сервис с подами нашего Deployment!
  ports:
    - protocol: TCP
      port: 8000      # Порт, который слушает сервис внутри кластера
      targetPort: 8000 # Порт, на котором работает само приложение в Docker
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-predict-ingress
  namespace: predict-service-ns
  annotations:
    # Важно для KinD: говорим использовать наш активированный Ingress Nginx
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    # Зачем: перехватываем трафик, идущий на внешний IP твоего сервера Contabo
    - host: predict.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fastapi-predict-service # Перенаправляем трафик на наш Service!
                port:
                  number: 8000
